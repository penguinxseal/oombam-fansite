<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <meta
    name="theme-color"
    content="#05070a"
  />

  <title>OomBam — Coming Soon</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  />

  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,500;1,500&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="teaser.css" />
</head>

<body>

  <main class="teaser">

    <!-- Main visual -->
    <div class="artwork-layer" aria-hidden="true">
      <img
        src="assets/images/teaser-penguin-seal.png"
        alt=""
        class="teaser-artwork"
      />
    </div>

    <!-- Soft readability overlays -->
    <div class="top-shade" aria-hidden="true"></div>
    <div class="bottom-shade" aria-hidden="true"></div>
    <div class="film-grain" aria-hidden="true"></div>

    <!-- Penguin ♥ Seal -->
    <div class="top-brand intro-item intro-brand">
      <span>PENGUIN</span>

      <span class="heart" aria-hidden="true">♥</span>

      <span>SEAL</span>
    </div>

    <!-- Main headline -->
    <section class="hero-copy intro-item intro-headline">

      <h1>
        <span>Something beautiful</span>
        <em>is blooming.</em>
      </h1>

    </section>

    <!-- Identity -->
    <section class="identity-block intro-item intro-identity">

      <div class="spark" aria-hidden="true"></div>

      <p class="identity">
        OOM
        <span>×</span>
        BAM
      </p>

    </section>

    <!-- Coming Soon -->
    <div class="coming-soon intro-item intro-coming">

      <span class="line"></span>

      <p>COMING SOON</p>

      <span class="line"></span>

    </div>

    <!-- Footer -->
    <footer class="footer intro-item intro-footer">

      <span>
        OOMBAM OFFICIAL FANSITE
      </span>

      <span>
        2026
      </span>

    </footer>

  </main>

  <script src="teaser.js"></script>

</body>
</html>
