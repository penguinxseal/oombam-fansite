<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <meta
    name="theme-color"
    content="#05070a"
  />

  <title>OomBam — Coming Soon</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  />

  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,500;1,500&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="teaser.css" />
</head>

<body>

  <main class="teaser">

    <!-- Ambient lights -->
    <div class="ambient-glow glow-blue" aria-hidden="true"></div>
    <div class="ambient-glow glow-pink" aria-hidden="true"></div>

    <!-- Main cinematic artwork -->
    <div class="artwork-wrap" aria-hidden="true">
      <img
        src="assets/images/teaser-penguin-seal.png"
        alt=""
        class="teaser-artwork"
      />
    </div>

    <!-- Text readability layer -->
    <div class="center-shadow" aria-hidden="true"></div>

    <!-- Film grain -->
    <div class="film-grain" aria-hidden="true"></div>

    <!-- Main teaser copy -->
    <section class="content">

      <p class="top-label scene scene-1">
        PENGUIN
        <span class="heart">♥</span>
        SEAL
      </p>

      <h1 class="headline scene scene-2">
        <span>Something</span>
        <span>beautiful</span>
        <em>is blooming.</em>
      </h1>

      <div class="identity scene scene-3">

        <div class="spark"></div>

        <p>
          OOM
          <span>×</span>
          BAM
        </p>

      </div>

      <div class="coming scene scene-4">

        <span class="line"></span>

        <p>COMING SOON</p>

        <span class="line"></span>

      </div>

    </section>

    <footer class="footer scene scene-4">

      <span>OOMBAM OFFICIAL FANSITE</span>

      <span>2026</span>

    </footer>

  </main>

  <script src="teaser.js"></script>

</body>
</html>
