<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>OomBam — Coming Soon</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=Playfair+Display:ital,wght@0,500;1,500&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="teaser.css" />
</head>

<body>

  <main class="teaser">

    <div class="background-glow glow-blue"></div>
    <div class="background-glow glow-pink"></div>

    <div class="grain"></div>

    <section class="teaser-content">

      <div class="symbol reveal reveal-1" aria-label="Penguin x Seal">
        <span class="symbol-name">PENGUIN</span>
        <span class="symbol-x">×</span>
        <span class="symbol-name">SEAL</span>
      </div>

      <p class="eyebrow reveal reveal-2">
        A NEW SPACE IS TAKING SHAPE
      </p>

      <h1 class="reveal reveal-3">
        Something beautiful
        <span>is blooming.</span>
      </h1>

      <div class="divider reveal reveal-4"></div>

      <div class="brand reveal reveal-5">
        <p>OOM × BAM</p>
      </div>

      <div class="coming-soon reveal reveal-6">
        <span></span>
        <p>COMING SOON</p>
        <span></span>
      </div>

    </section>

    <footer class="teaser-footer reveal reveal-6">
      <span>OOMBAM OFFICIAL FANSITE</span>
      <span>PENGUIN × SEAL</span>
    </footer>

  </main>

  <script src="teaser.js"></script>

</body>
</html>
