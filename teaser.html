<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#05070a" />
  <meta name="description" content="OomBam Official Fansite — Something beautiful is blooming." />
  <title>OomBam — Coming Soon</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,500;1,500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="teaser.css?v=20260828-7" />
</head>
<body>
  <main class="teaser" id="teaser">
    <div class="ambient ambient-blue" aria-hidden="true"></div>
    <div class="ambient ambient-pink" aria-hidden="true"></div>
    <div class="center-haze" aria-hidden="true"></div>

    <div class="particles" aria-hidden="true">
      <span class="bubble b1"></span><span class="bubble b2"></span><span class="bubble b3"></span>
      <span class="bubble b4"></span><span class="bubble b5"></span><span class="bubble b6"></span>
      <span class="petal p1"></span><span class="petal p2"></span><span class="petal p3"></span>
      <span class="petal p4"></span><span class="petal p5"></span>
    </div>

    <header class="top-brand reveal reveal-brand" aria-label="Penguin and Seal">
      <span>PENGUIN</span><span class="heart">♥</span><span>SEAL</span>
    </header>

    <section class="mascot-stage" aria-label="Cute animated penguin and seal">
      <div class="mascot-zone mascot-zone-penguin">
        <div class="mascot-glow mascot-glow-blue" aria-hidden="true"></div>
        <div class="mascot-orbit mascot-orbit-penguin">
          <img
            src="assets/images/teaser-penguin.png?v=20260828-7"
            class="mascot mascot-penguin"
            alt="Cute penguin mascot"
            decoding="async"
            fetchpriority="high"
            draggable="false"
          />
        </div>
      </div>

      <div class="meeting-glow" aria-hidden="true">
        <span class="meeting-core"></span>
        <span class="meeting-ring meeting-ring-one"></span>
        <span class="meeting-ring meeting-ring-two"></span>
      </div>

      <div class="mascot-zone mascot-zone-seal">
        <div class="mascot-glow mascot-glow-pink" aria-hidden="true"></div>
        <div class="mascot-orbit mascot-orbit-seal">
          <img
            src="assets/images/teaser-seal.png?v=20260828-7"
            class="mascot mascot-seal"
            alt="Cute seal mascot"
            decoding="async"
            fetchpriority="high"
            draggable="false"
          />
        </div>
      </div>
    </section>

    <section class="teaser-copy" aria-labelledby="teaser-title">
      <p class="eyebrow reveal reveal-eyebrow">OOMBAM OFFICIAL FANSITE</p>
      <h1 id="teaser-title">
        <span class="headline-main reveal reveal-headline">Something beautiful</span>
        <em class="headline-bloom reveal reveal-bloom">is blooming.</em>
      </h1>
      <p class="identity reveal reveal-identity">OOM <span>×</span> BAM</p>
      <div class="coming-soon reveal reveal-coming" aria-label="Coming soon">
        <span class="line"></span><span>COMING SOON</span><span class="line"></span>
      </div>
    </section>

    <footer class="teaser-footer reveal reveal-footer">
      <span>DESIGNED WITH LOVE FOR OOMBAM</span>
      <span>2026</span>
    </footer>
  </main>

  <script src="teaser.js?v=20260828-7" defer></script>

</html>
