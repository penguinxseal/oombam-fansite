<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#030711" />
  <meta name="description" content="OomBam Official Fansite — Something beautiful is blooming." />
  <title>OomBam Official Fansite — Coming Soon</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:wght@500;600&family=Italianno&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="teaser.css?v=20260828-17" />
</head>
<body>
  <main class="teaser" id="teaser">
    <!-- Ambient background already used by the teaser page -->
    <div class="opening-bg" aria-hidden="true"></div>

    <!-- Continuous live ambience: visible before AND after hero reveal -->
    <div class="ambient-motion" aria-hidden="true">
      <div class="water-field">
        <span class="droplet d1"></span><span class="droplet d2"></span><span class="droplet d3"></span>
        <span class="droplet d4"></span><span class="droplet d5"></span><span class="droplet d6"></span>
        <span class="droplet d7"></span><span class="droplet d8"></span><span class="droplet d9"></span>
      </div>

      <div class="clover-field">
        <span class="clover c1">☘</span><span class="clover c2">☘</span><span class="clover c3">☘</span>
        <span class="clover c4">☘</span><span class="clover c5">☘</span>
      </div>

      <div class="sakura-field">
        <span class="petal p1"></span><span class="petal p2"></span><span class="petal p3"></span>
        <span class="petal p4"></span><span class="petal p5"></span><span class="petal p6"></span>
        <span class="petal p7"></span><span class="petal p8"></span><span class="petal p9"></span>
      </div>
    </div>

    <!-- Hero artwork: pure crossfade; no blur, scale, brightness shift, or parallax -->
    <div class="hero-reveal" aria-hidden="true">
      <div class="hero-image"></div>
      <div class="center-bloom"></div>
    </div>

    <!-- Live HTML typography -->
    <header class="top-brand sequence sequence-brand" aria-label="Penguin and Seal">
      <span>PENGUIN</span><span class="heart">♥</span><span>SEAL</span>
    </header>

    <section class="hero-copy" aria-labelledby="teaser-title">
      <p class="eyebrow sequence sequence-eyebrow">OOMBAM OFFICIAL FANSITE</p>
      <h1 id="teaser-title" class="hero-title">
        <span class="headline-main sequence sequence-headline">Something beautiful</span>
        <span class="headline-bloom sequence sequence-bloom">is blooming.</span>
      </h1>
      <p class="identity sequence sequence-identity">
        <span>OOM</span><span class="pair-x">×</span><span>BAM</span>
      </p>
      <div class="coming sequence sequence-coming" aria-label="Coming soon">
        <span class="line"></span><span>COMING SOON</span><span class="line"></span>
      </div>
    </section>

    <footer class="footer sequence sequence-footer">
      <span>DESIGNED WITH LOVE FOR OOMBAM</span><span>2026</span>
    </footer>

    <div class="vignette" aria-hidden="true"></div>
  </main>
  <script src="teaser.js?v=20260828-17" defer></script>
</body>
</html>
