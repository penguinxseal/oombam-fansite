<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="OomBam Official Fansite — Something beautiful is blooming.">
  <title>OomBam Official Fansite — Coming Soon</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Allura&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="teaser.css?v=10">
</head>
<body>
  <main class="teaser" id="teaser">

    <div class="ambient ambient-blue" aria-hidden="true"></div>
    <div class="ambient ambient-pink" aria-hidden="true"></div>
    <div class="vignette" aria-hidden="true"></div>

    <header class="brand">
      <span>PENGUIN</span>
      <span class="brand-heart">♥</span>
      <span>SEAL</span>
    </header>

    <!-- IMPORTANT:
         This now references the hero file directly from teaser.html.
         Relative path works correctly on GitHub Pages project sites. -->
    <div class="character character-penguin" aria-hidden="true">
      <div class="character-window character-window-penguin">
        <img
          class="character-art character-art-penguin"
          src="assets/images/teaser-hero.png"
          alt=""
          draggable="false"
        >
      </div>
      <div class="character-glow glow-blue"></div>
    </div>

    <div class="character character-seal" aria-hidden="true">
      <div class="character-window character-window-seal">
        <img
          class="character-art character-art-seal"
          src="assets/images/teaser-hero.png"
          alt=""
          draggable="false"
        >
      </div>
      <div class="character-glow glow-pink"></div>
    </div>

    <div class="water-layer" id="waterLayer" aria-hidden="true"></div>
    <div class="petal-layer" id="petalLayer" aria-hidden="true"></div>

    <div class="heart-live" aria-hidden="true">♥</div>

    <section class="copy">
      <p class="eyebrow">OOMBAM OFFICIAL FANSITE</p>

      <h1 class="title">
        <span class="title-main">
          <span class="word word-1">Something</span>
          <span class="word word-2">beautiful</span>
        </span>

        <span class="title-script">is blooming.</span>
      </h1>

      <div class="pair">
        <span class="oom">OOM</span>
        <span class="x">×</span>
        <span class="bam">BAM</span>
      </div>

      <div class="coming">
        <span class="line"></span>
        <span>COMING SOON</span>
        <span class="line"></span>
      </div>
    </section>

    <footer class="footer">
      <span>DESIGNED WITH LOVE FOR OOMBAM</span>
      <span>2026</span>
    </footer>
  </main>

  <script src="teaser.js?v=10" defer></script>
</body>
</html>
